# Universo de empresas que lee el radar. Ejemplo real: Colombia y roles globales de finanzas.
#
# Cada empresa declara sus fuentes. `verified_at` registra la última vez que la fuente se
# leyó bien; las fuentes sin esa fecha también se leen: leerlas es la verificación.
# La sección `boards` (al final) suma empresas por slug de Greenhouse, Ashby, Lever, etc.
#
# tier: 1 = empleador de élite (banca de inversión, multilaterales, consultoría estratégica,
#           pagos y tecnología globales); 2 = gran empresa o líder local; 3 = resto.
# method: greenhouse | ashby | lever | smartrecruiters | workable | recruitee | workday |
#         oracle | successfactors | phenom | cornerstone | impactpool | hirehive | magneto |
#         amazon | page (portal sin API legible: acceso + manual)
# queries: búsquedas de texto para portales globales (Workday/Oracle/SuccessFactors).
# status de una fuente `page`: se comprueba el acceso; las vacantes se revisan a mano o por
#         Indeed. Nunca se registra como "sin vacantes".
